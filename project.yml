name: ISeeYou
options:
  bundleIdPrefix: com.iseeyou
  deploymentTarget:
    iOS: '17.2'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
packages:
  MetaWearables:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  ISeeYou:
    type: application
    platform: iOS
    sources:
      - path: ISeeYou
        excludes: [Models]
    dependencies:
      - package: MetaWearables
        product: MWDATCore
      - package: MetaWearables
        product: MWDATCamera
    postBuildScripts:
      - name: Compile optional YOLO11n model
        basedOnDependencyAnalysis: false
        script: |
          if [ -d "$SRCROOT/ISeeYou/Models/yolo11n.mlpackage" ]; then
            mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
            xcrun coremlcompiler compile "$SRCROOT/ISeeYou/Models/yolo11n.mlpackage" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          fi
          if [ -d "$SRCROOT/ISeeYou/Models/MetricDepthSmall.mlpackage" ]; then
            xcrun coremlcompiler compile "$SRCROOT/ISeeYou/Models/MetricDepthSmall.mlpackage" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          fi
    info:
      path: ISeeYou/Info.plist
      properties:
        CFBundleDisplayName: I See You
        NSCameraUsageDescription: Live camera frames are processed on your iPhone to detect objects. No images are saved or uploaded.
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.iseeyou.research
            CFBundleURLSchemes: [iseeyou]
        MWDAT:
          AppLinkURLScheme: "iseeyou://"
          Analytics:
            OptOut: true
          CrashReporting:
            OptOut: true
        NSBluetoothAlwaysUsageDescription: Connect to your Meta glasses for camera input and spoken distance estimates.
        NSLocalNetworkUsageDescription: Connect to your Meta glasses over Wi-Fi for camera streaming.
        NSBonjourServices: ["_bonjour._tcp"]
        UIBackgroundModes: [audio, bluetooth-central, bluetooth-peripheral, external-accessory]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.iseeyou.research
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  ISeeYouTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ISeeYouTests]
    dependencies:
      - target: ISeeYou
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ISeeYouUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ISeeYouUITests]
    dependencies:
      - target: ISeeYou
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ISeeYou:
    build:
      targets:
        ISeeYou: all
    test:
      targets: [ISeeYouTests, ISeeYouUITests]
  UnitChecks:
    build:
      targets:
        ISeeYou: all
    test:
      targets: [ISeeYouTests]
